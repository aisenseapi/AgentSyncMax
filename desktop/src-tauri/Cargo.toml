[package]
name = "agentsync-desktop"
version = "4.26.2"
description = "AgentSync desktop control center"
license = "MIT"
repository = "https://github.com/aisenseapi/AgentSyncMax"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_IO", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
