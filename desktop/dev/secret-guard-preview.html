<!doctype html>
<html lang="nb">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hemmelighetsvern · isolert UI-test</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/secret-guard.css">
<style>body { padding: 20px; height: auto; overflow: auto; } main { max-width: 700px; } textarea { display: block; width: min(90%, 600px); height: 110px; margin: 16px 0; } #testStatus { margin: 16px 0; } button { margin: 4px; padding: 8px; } #testHeader { min-height: 32px; }</style>
<main>
  <header id="testHeader"></header>
  <h1>Isolert visningstest</h1>
  <p>Bare syntetiske funn. Ingen modell, native motor, filer eller nettjenester blir brukt.</p>
  <textarea id="testDraft" aria-label="Testutkast">Dette utkastet skal beholdes når jeg avbryter.</textarea>
  <button id="testSend" type="button">Vis blokkert overføring</button>
  <button id="testUnreadable" type="button">Vis uleselig kilde</button>
  <button id="testTheme" type="button">Bytt lyst/mørkt</button>
  <p id="testStatus" role="status">Ingen handling startet.</p>
  <section id="testSettings"></section>
</main>
<script>
(() => {
  let enabled = true, allowed = false;
  window.__TAURI__ = { core: { invoke: async (command, args) => {
    if (command === 'get_secret_guard_settings') return { enabled };
    if (command === 'set_secret_guard_settings') return { enabled: enabled = args.enabled };
    if (command === 'allow_secret_guard_once') { allowed = true; return; }
    if (command === 'start_mission') {
      if (!enabled || allowed) { allowed = false; return { missionId: 'simulert-ikke-sendte-data' }; }
      throw 'SECRET_GUARD:' + JSON.stringify({ code: 'SECRET_GUARD', token: 'test-only', canAllowOnce: !args.request.unreadable,
        operation: 'Start oppdrag', recipient: 'Testleverandør / testmodell', findings: [
          { source: 'C:/Testprosjekt/config/.env.local', kind: 'Miljøfil med mulig hemmelighet', line: 4 },
          { source: 'Prompt', kind: 'Tokenmønster', line: 2 },
          { source: 'C:/Testprosjekt/en-svært-lang-prosjektmappe/undermappe/konfigurasjon/settings.json', kind: args.request.unreadable ? 'Innhold kunne ikke kontrolleres' : 'Mulig legitimasjon', line: 18 }
        ] });
    }
    throw new Error('Ukjent testkommando');
  } } };
})();
</script>
<script src="/secret-guard.js"></script>
<script>
AgentSyncSecretGuard.init({ indicatorParent: document.getElementById('testHeader') });
AgentSyncSecretGuard.mountSettings(document.getElementById('testSettings'));
const send = async unreadable => {
  const status = document.getElementById('testStatus');
  status.textContent = 'Venter på avklaring.';
  try { await AgentSyncSecretGuard.invoke('start_mission', { request: { prompt: document.getElementById('testDraft').value, unreadable } }); status.textContent = 'Ett engangsunntak bekreftet i testen. Ingen data ble sendt.'; }
  catch (error) { status.textContent = error.message; }
};
document.getElementById('testSend').onclick = () => send(false);
document.getElementById('testUnreadable').onclick = () => send(true);
document.getElementById('testTheme').onclick = () => { document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'; };
</script>
</html>
